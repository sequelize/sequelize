services:
  db2-oldest:
    container_name: sequelize-db2-oldest
    image: icr.io/db2_community/db2:11.5.5.1
    privileged: true
    env_file: ../.env_list
    environment:
      DBNAME: testdb
    ports:
      - 50000:50000
    volumes:
      - db2-oldest:/database
    healthcheck:
      # The setup script restarts the instance twice after creating the database. Requiring its
      # completion marker prevents a probe from passing in the short windows between those restarts.
      test: test -f /database/config/.shared-data/setup_complete && su - db2inst1 -c "db2 connect to testdb; db2 select 1 from sysibm.sysdummy1" || exit 1
      # failed probes while the database is still being created do not count towards `retries`
      start_period: 300s
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  default:
    name: sequelize-db2-oldest-network

volumes:
  db2-oldest:
    name: sequelize-db2-oldest-volume
