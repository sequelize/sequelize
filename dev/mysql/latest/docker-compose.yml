services:
  mysql-latest:
    container_name: sequelize-mysql-latest
    image: mysql:8.4.8
    environment:
      MYSQL_DATABASE: sequelize_test
      MYSQL_USER: sequelize_test
      MYSQL_PASSWORD: sequelize_test
      MYSQL_ROOT_PASSWORD: sequelize_test
    ports:
      - 20057:3306
    volumes:
      - mysql-latest:/var/lib/mysql
    healthcheck:
      # --protocol=TCP forces a TCP probe. During initialisation the entrypoint runs a temporary
      # server with --skip-networking, so a socket probe reports healthy before the real server is up.
      test:
        [
          'CMD',
          'mysqladmin',
          '--protocol=TCP',
          '-h',
          '127.0.0.1',
          '-usequelize_test',
          '-psequelize_test',
          'status',
        ]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 60s

networks:
  default:
    name: sequelize-mysql-latest-network

volumes:
  mysql-latest:
    name: sequelize-mysql-latest-volume
