services:
  oracle-latest:
    container_name: sequelize-oracle-latest
    image: gvenzl/oracle-free:23.26.1-slim
    environment:
      ORACLE_PASSWORD: password
      ORACLE_DATABASE: XEPDB1
    ports:
      - 1521:1521
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'echo "select 1 from dual;" | sqlplus -L -S system/password@localhost:1521/XEPDB1',
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 120s

networks:
  default:
    name: sequelize-oracle-latest-network
