name: Test Postgres

on:
  push:
    branches: [main, 'release/**', 'develop-v4']
  pull_request:
    branches: [main, 'release/**', 'develop-v4']
  workflow_dispatch:

jobs:
  test-postgres:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    name: test-postgres (node ${{ matrix.node-version }})

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: sequelize_test
          POSTGRES_PASSWORD: sequelize_test
          POSTGRES_DB: sequelize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequelize_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Postgres extensions
        env:
          PGPASSWORD: sequelize_test
        run: psql -h localhost -U sequelize_test -d sequelize_test -f test/config/init-postgres.sql

      - run: pnpm install --frozen-lockfile

      - name: Run Postgres tests
        env:
          DIALECT: postgres
          SEQ_PORT: 5432
          SEQ_USER: sequelize_test
          SEQ_PW: sequelize_test
          SEQ_DB: sequelize_test
        run: pnpm run test-postgres
