name: Lint & Format

on:
  push:
    branches: [main, 'release/**', 'develop-v4']
  pull_request:
    branches: [main, 'release/**', 'develop-v4']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint
