name: Lint & Format

on:
  push:
    branches: [main, 'release/**', 'develop-v4']
  pull_request:
    branches: [main, 'release/**', 'develop-v4']
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm install

      - name: Check formatting
        run: npm run fmt:check

      - name: Lint
        run: npm run lint

      - name: No focused tests
        run: |
          if grep -rnE '\b(describe|context|it|specify|before|after|beforeEach|afterEach)\.only\b' test; then
            echo "::error::Found focused test(s) (.only). Remove before merging."
            exit 1
          fi

  types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm install

      - name: Type check
        run: npm run test:types
