# Companion to test-postgres.yml. That job installs from the committed lockfile
# so PR failures always mean "your change broke it". This one deliberately
# ignores the lockfile and resolves every dependency range fresh, so upstream
# releases that break us surface here on a schedule instead of in a consumer.
name: Floating Deps

on:
  schedule:
    # Mondays, 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  floating:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: sequelize_test
          POSTGRES_PASSWORD: sequelize_test
          POSTGRES_DB: sequelize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequelize_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Postgres extensions
        env:
          PGPASSWORD: sequelize_test
        run: psql -h localhost -U sequelize_test -d sequelize_test -f test/config/init-postgres.sql

      - name: Install with freshly resolved dependencies
        run: pnpm install --no-lockfile

      - name: Report resolved versions
        run: pnpm list --depth 0

      - name: Run Postgres tests
        env:
          DIALECT: postgres
          SEQ_PORT: 5432
          SEQ_USER: sequelize_test
          SEQ_PW: sequelize_test
          SEQ_DB: sequelize_test
        run: pnpm run test-postgres
